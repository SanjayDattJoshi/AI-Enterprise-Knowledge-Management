t-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-16 pb-xxl bg-surface"><div class="flex flex-col w-full h-full min-h-[calc(100vh-4rem)] items-center justify-center p-md bg-surface relative overflow-hidden">
<!-- Subtle ambient background -->
<div class="absolute inset-0 z-0 opacity-30 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary-fixed blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-secondary-fixed blur-[140px] rounded-full"></div>
</div>
<!-- Login Container -->
<div class="w-full max-w-sm bg-surface-container-lowest rounded-xl shadow-[0_12px_32px_rgba(15,23,42,0.12)] p-lg relative z-10 flex flex-col items-center">

<div class="w-24 h-24 mb-xl rounded-full overflow-hidden shadow-[0_4px_12px_rgba(15,23,42,0.08)] bg-surface-bright flex items-center justify-center">
<img alt="Cognitive Search Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBbwgSb7JV-9c9UbvLfGLYwEpJ6ZWpo-tcOAA9Qpwdc_6RbSRiXx823WmbX4CVxCSS7BqzZAFuw5N7hGHC8X_JZTpVcQ807kdef8O9Z551mOg90pqPPDtklxHHvlTO7OrcVgpKw3-bVfaNImLIWj2U-_OCC9huEpfsZem-yXCzim_YNYHbmWDWMP-SF_vQ4xItFKcZWYkdVVWo5BkPzoxza-ZXklceizfYmDlRSqRHDewvsrjjHlw"/>
</div>
<!-- Typography Header -->
<div class="text-center mb-xl w-full">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm">Welcome Back</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to access enterprise knowledge.</p>
</div>
<!-- Form Elements -->
<form class="w-full flex flex-col gap-lg" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full h-12 pl-xxl pr-md bg-surface-bright rounded-lg font-body-md text-body-md text-on-surface outline-none transition-all border border-outline-variant focus:border-primary focus:ring-4 focus:ring-primary/20 placeholder:text-outline" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-secondary transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full h-12 pl-xxl pr-xxl bg-surface-bright rounded-lg font-body-md text-body-md text-on-surface outline-none transition-all border border-outline-variant focus:border-primary focus:ring-4 focus:ring-primary/20 placeholder:text-outline" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-md text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none flex items-center justify-center h-full" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="visibilityIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-sm mt-xs">
<div class="relative flex items-center">
<input class="peer w-5 h-5 appearance-none border border-outline-variant rounded-md checked:bg-primary checked:border-primary transition-colors cursor-pointer focus:ring-2 focus:ring-primary/20 focus:outline-none" id="remember" type="checkbox"/>
<span class="material-symbols-outlined absolute pointer-events-none text-on-primary text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity left-[2px] top-[2px]">check</span>
</div>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">Remember this device</label>
</div>
<!-- Submit Button -->
<button class="w-full h-12 mt-md bg-primary text-on-primary rounded-lg font-label-md text-label-md flex items-center justify-center gap-sm hover:bg-on-primary-fixed transition-colors shadow-[0_4px_12px_rgba(15,23,42,0.08)] relative overflow-hidden group" id="submitBtn" type="submit">
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" id="btnIcon">login</span>
<span id="btnText">Sign In</span>
<!-- Loading Spinner (Hidden by default) -->
<svg class="animate-spin hidden w-5 h-5 text-on-primary absolute" fill="none" id="btnSpinner" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</button>

<div class="mt-xl text-center w-full">

                Protected by <span class="text-on-surface-variant font-semibold">Enterprise Auth</span>
</p>
</div>
</div>
</div>
<script>
    // Password Toggle Logic
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const visibilityIcon = document.getElementById('visibilityIcon');

    toggleBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        visibilityIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
    });

    // Mock Login Simulation
    function handleLogin() {
        const btn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const btnSpinner = document.getElementById('btnSpinner');

        // Set Loading State
        btn.disabled = true;
        btnText.classList.add('opacity-0');
        btnIcon.classList.add('opacity-0');
        btnSpinner.classList.remove('hidden');

        // Simulate network request
        setTimeout(() => {
            // Reset state (In a real app, this would redirect)
            btn.disabled = false;
            btnText.classList.remove('opacity-0');
            btnIcon.classList.remove('opacity-0');
            btnSpinner.classList.add('hidden');
            
            // Visual feedback of success
            btnText.textContent = "Success";
            btnIcon.textContent = "check_circle";
            btnText.classList.remove('opacity-0');
            btnIcon.classList.remove('opacity-0');
            btn.classList.replace('bg-primary', 'bg-tertiary-fixed-dim');
            btn.classList.replace('text-on-primary', 'text-on-tertiary-fixed');
            
            setTimeout(() => {
                btnText.textContent = "Sign In";
                btnIcon.textContent = "login";
                btn.classList.replace('bg-tertiary-fixed-dim', 'bg-primary');
                btn.classList.replace('text-on-tertiary-fixed', 'text-on-primary');
            }, 2000);

        }, 1500);
    }
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_-1px_12px_rgba(0,0,0,0.04)]" data-active-classes="text-secondary font-bold"><div class="flex justify-around items-center h-16 px-md"><a aria-current="page" class="flex flex-col items-center justify-center gap-xs w-16 text-secondary font-bold" data-path="search" href="#"><span class="material-symbols-outlined">search</span><span class="font-label-md text-label-md">Search</span></a><a class="flex flex-col items-center justify-center gap-xs w-16 text-on-surface-variant" data-path="history" href="#"><span class="material-symbols-outlined">history</span><span class="font-label-md text-label-md">History</span></a><a class="flex flex-col items-center justify-center gap-xs w-16 text-on-surface-variant" data-path="sources" href="#"><span class="material-symbols-outlined">database</span><span class="font-label-md text-label-md">Sources</span></a><a class="flex flex-col items-center justify-center gap-xs w-16 text-on-surface-variant" data-path="settings" href="#"><span class="material-symbols-outlined">settings</span><span class="font-label-md text-label-md">Settings</span></a></div></nav></body></html>
