<script>
  function toggleStatus(btn) {
    const card = btn.closest('.user-card');
    const isCurrentlyActive = card.getAttribute('data-status') === 'active';
    const indicator = card.querySelector('.status-indicator');
    const text = card.querySelector('.status-text');
    const name = card.querySelector('h3');
    
    if (isCurrentlyActive) {
      card.setAttribute('data-status', 'disabled');
      card.classList.add('opacity-60', 'grayscale-[0.5]');
      indicator.classList.remove('bg-tertiary-fixed-dim');
      indicator.classList.add('bg-error');
      text.textContent = 'Disabled';
      text.classList.remove('text-on-surface-variant');
      text.classList.add('text-error');
      name.classList.add('line-through', 'decoration-on-surface-variant/50');
      btn.textContent = 'Enable';
      btn.classList.remove('text-error');
      btn.classList.add('text-secondary');
    } else {
      card.setAttribute('data-status', 'active');
      card.classList.remove('opacity-60', 'grayscale-[0.5]');
      indicator.classList.remove('bg-error');
      indicator.classList.add('bg-tertiary-fixed-dim');
      text.textContent = 'Active';
      text.classList.remove('text-error');
      text.classList.add('text-on-surface-variant');
      name.classList.remove('line-through', 'decoration-on-surface-variant/50');
      btn.textContent = 'Disable';
      btn.classList.remove('text-secondary');
      btn.classList.add('text-error');
    }
  }

  // Simple search filter
  const searchInput = document.querySelector('input[type="text"]');
  searchInput.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    const cards = document.querySelectorAll('.user-card');
    
    cards.forEach(card => {
      const name = card.querySelector('h3').textContent.toLowerCase();
      const email = card.querySelector('p').textContent.toLowerCase();
      
      if (name.includes(term) || email.includes(term)) {
        card.style.display = 'flex';
      } else {
        card.style.display = 'none';
      }
    });
  });
